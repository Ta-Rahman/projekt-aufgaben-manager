spring.application.name=aufgaben-manager

# --- Docker Compose (nur lokale Entwicklung) ---
# Spring Boot startet die Datenbank aus der docker-compose.yml im Repo-Wurzelverzeichnis
# und übernimmt URL, Benutzer und Passwort automatisch. In Tests ist das abgeschaltet.
spring.docker.compose.file=../docker-compose.yml
# Datenbank beim Beenden der App weiterlaufen lassen (schnellerer Neustart).
spring.docker.compose.lifecycle-management=start-only

# --- JPA / Hibernate ---
# Hibernate erzeugt oder ändert das Schema nicht, sondern prüft nur, ob Entitäten und Tabellen passen.
spring.jpa.hibernate.ddl-auto=validate
# Keine offene DB-Sitzung bis in die View/den Controller: Lazy Loading nur innerhalb von Transaktionen.
spring.jpa.open-in-view=false

# --- Flyway ---
# Schema ausschließlich über versionierte SQL-Migrationen in src/main/resources/db/migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
